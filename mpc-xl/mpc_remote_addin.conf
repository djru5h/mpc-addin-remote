# MPC Remote on the MPC XL, loaded inside MPC (remote.conf is the standalone copy's). Read when MPC starts.
enabled=1
# The device only: reached through an SSH tunnel. There is no login, so don't open this to the network.
bind=127.0.0.1
port=6720
touch_device=auto
# auto shows the XL's screen upside down
screen_rotate=270
touch_rotate=0
max_fps=10
max_clients=6
nice=10
# The AI endpoint and its file reading, off until they're wanted
mcp=0
mcp_files=none
# Lets the addin add button presses to MPC's button input
buttons_input=1
